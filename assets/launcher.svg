    <rect x="212" y="424" width="176" height="176" rx="40" fill="#f5bc2b"/>
    <rect x="424" y="424" width="176" height="176" rx="40" fill="#f08a24"/>
    <rect x="212" y="212" width="176" height="176" rx="40" fill="#ffffff"/>
    <path d="M276 258 L346 300 L276 342 Z" fill="#151922" stroke="#151922" stroke-width="14" stroke-linejoin="round"/>
